<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EcoPegada</title>
</head>
<body>
    <h1>🌍 EcoPegada</h1>
    <p>Descubra quanto CO₂ seus hábitos emitem por ano.</p>

    <form method="post">
        <p>Km de carro por semana: <input type="number" name="km_carro" step="any" min="0" value="0" required></p>
        <p>Consumo de energia por mês (kWh): <input type="number" name="kwh" step="any" min="0" value="150" required></p>
        <p>Refeições com carne por semana: <input type="number" name="carne" step="any" min="0" value="7" required></p>
        <button type="submit">Calcular</button>
    </form>

    {% if total is not none %}
        <h2>Sua pegada: {{ total }} toneladas de CO₂ por ano</h2>
    {% endif %}
</body>
</html>
