{% extends "base.html" %}
{% block conteudo %}
<form action="/resultado" method="post" class="card">
    <h2>Seus hábitos</h2>

    <label>Km rodados de carro por semana
        <input type="number" name="km_carro" min="0" step="any" value="0" required></label>

    <label>Km de ônibus por semana
        <input type="number" name="km_onibus" min="0" step="any" value="0" required></label>

    <label>Consumo de energia por mês (kWh, está na conta de luz)
        <input type="number" name="kwh_mes" min="0" step="any" value="150" required></label>

    <label>Refeições com carne por semana
        <input type="number" name="refeicoes_carne" min="0" step="any" value="7" required></label>

    <label>Como você descarta o lixo?
        <select name="lixo">
            <option value="separa">Separo o reciclável</option>
            <option value="parcial" selected>Separo às vezes</option>
            <option value="nao_separa">Não separo</option>
        </select></label>

    <button type="submit">Calcular minha pegada</button>
</form>
{% endblock %}
